name: Deploy

# Deploys main to the server after CI succeeds, or on demand. Needs repository secrets:
#   DEPLOY_HOST     server IPv4
#   DEPLOY_SSH_KEY  private key allowed to log in as DEPLOY_USER (default: ubuntu)
# Optional repository variables: DEPLOY_USER, PREVIEW (default true).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::notice::DEPLOY_HOST or DEPLOY_SSH_KEY not set; skipping deploy."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Deploy over SSH
        if: env.SKIP != '1'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          USER_NAME: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          PREVIEW: ${{ vars.PREVIEW || 'true' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2> /dev/null
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i ~/.ssh/deploy_key "$USER_NAME@$HOST" "PREVIEW=$PREVIEW bash -s" < deploy/bootstrap.sh
