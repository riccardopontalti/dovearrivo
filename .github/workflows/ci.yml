name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated API files match the contract
        run: npm run gen:api && git diff --exit-code -- src/lib/api
      - run: npm run check
      - run: npm test
      - run: npm run build

  engine:
    # Contract tests against the pinned MOTIS release with synthetic fixtures (no live data).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download MOTIS and import fixtures
        run: npm run engine:fixtures
      - name: Start MOTIS
        run: |
          .engine/bin/motis server -d .engine/data > .engine/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8090/api/v1/health > /dev/null && exit 0
            sleep 1
          done
          cat .engine/server.log
          exit 1
      - run: npm run test:engine

  e2e:
    # Search flows on desktop and mobile, with and without JavaScript, plus axe checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    # Builds the production images and checks the Compose file; nothing is pushed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp deploy/.env.example deploy/.env && docker compose -f deploy/compose.yml config --quiet
      - run: docker build -f deploy/Dockerfile.app -t dovearrivo-app:ci .
      - run: docker build -f deploy/Dockerfile.data -t dovearrivo-data:ci .
      - name: Tools inside the data image
        run: |
          docker run --rm dovearrivo-data:ci sh -c '/opt/motis/motis --version && osmium --version | head -1 && pmtiles version && java -version 2>&1 | head -1 && node --version'
