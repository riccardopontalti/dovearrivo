# Initial registry: project configuration, not a MOTIS format.
# status: verified = inspected and usable; candidate = must pass D01; optional = evaluate in D01.
schema_version: 2
region_id: trentino
timezone: Europe/Rome
transit:
  - id: tte
    status: verified
    publisher: Trentino Trasporti S.p.A.
    url: https://www.trentinotrasporti.it/opendata/google_transit_extraurbano_tte.zip
    local_name: extraurbano.zip
    source_page: https://www.trentinotrasporti.it/it/opendata-it
    license: CC-BY-2.5-IT
    license_url: https://creativecommons.org/licenses/by/2.5/it/
    kind: gtfs-static
  - id: ttu
    status: verified
    publisher: Trentino Trasporti S.p.A.
    url: https://www.trentinotrasporti.it/opendata/google_transit_urbano_tte.zip
    local_name: urbano.zip
    source_page: https://www.trentinotrasporti.it/it/opendata-it
    license: CC-BY-2.5-IT
    license_url: https://creativecommons.org/licenses/by/2.5/it/
    kind: gtfs-static
  - id: trenitalia
    status: verified
    publisher: Trenitalia S.p.A.
    # Primary source: NAP asset 1080596 (IT-IT-TRENITALIA_L1.xml.gz). The pipeline repacks it as ZIP,
    # as the Transitous preprocessor does. D01 used the Transitous mirror (valid 2026-05-23..2026-12-12).
    url: https://www.cciss.it/nap/mmtis/public/api/v1/download/blob/Asset/1080596/resource
    local_name: trenitalia-netex.zip
    source_page: https://www.cciss.it/nap/mmtis/public/static/multimodal
    license: unstated # the NAP states no licence; used by maintainer decision on 2026-09-25, attribute and remove on request
    license_url: null
    kind: netex
    notes:
      - D01 passed technically; national feed imports in seconds and fits in memory.
      - MOTIS loads the NeTEx ZIP directly; no Lua script needed.
      - Timetable changes on 2026-12-13; the feed must be refreshed before then.
  - id: sta
    status: optional
    publisher: STA — Südtiroler Transportstrukturen AG
    url: ftp://ftp.sta.bz.it/gtfs/google_transit_shp.zip
    local_name: sta.zip
    source_page: https://github.com/noi-techpark/opendatahub-gtfs-api
    license: CC0-1.0 # as stated by Open Data Hub; confirm in D01
    license_url: https://github.com/noi-techpark/opendatahub-gtfs-api/blob/839d698938a224a7db4885f717ca05706fa6bae1/datasets.yml#L33
    kind: gtfs-static
street:
  id: osm-italy-nord-est
  # The openstreetmap.fr Trentino-Alto Adige extract has missing node references and breaks
  # the MOTIS import (D01). Download Geofabrik Nord-Est and clip with complete ways.
  url: https://download.geofabrik.de/europe/italy/nord-est-latest.osm.pbf
  local_name: nord-est.osm.pbf
  clip:
    tool: osmium extract --strategy complete_ways
    bbox: [10.38, 45.66, 12.49, 47.10]
    output: streets.osm.pbf
  source_page: https://download.geofabrik.de/europe/italy/nord-est.html
  license: ODbL-1.0
  license_url: https://www.openstreetmap.org/copyright
basemap:
  id: protomaps
  status: candidate
  kind: pmtiles
  local_name: basemap.pmtiles
  source_page: https://docs.protomaps.com/
  license: ODbL-1.0 # data; record style, font and sprite licences separately in D07
  license_url: https://www.openstreetmap.org/copyright
updates:
  gtfs_check_hours: 6
  timetable_rollover_hours: 24
  osm_check_days: 7
  unverified_warning_hours: 72
  unverified_suspend_days: 7
limits:
  gtfs_download_bytes: 83886080
  gtfs_total_uncompressed_bytes: 536870912
  netex_download_bytes: 104857600
  osm_download_bytes: 1073741824
  http_timeout_seconds: 30
  retries: 2
  retain_generations: 2
notes:
  - The Dati Trentino catalogue also lists CC BY 4.0; keep the operator's direct statement.
  - No real-time source approved for the first release (STA publishes GTFS-RT, evaluate after launch).
  - Verify actual coverage through calendars and trips, not only feed_info.
